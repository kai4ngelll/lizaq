<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>С днём рождения!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#e8c37a;
    --gold-soft:rgba(232,195,122,.55);
    --ink:#0c0918;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;}
  body{
    background:radial-gradient(120% 90% at 50% 20%, #1c1433 0%, #120d24 45%, #0c0918 100%);
    font-family:'Cormorant Garamond', serif;
    color:var(--gold);
    user-select:none;
    -webkit-user-select:none;
  }
  /* лёгкое звёздное небо — дешёво для телефона (только анимация прозрачности) */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:1;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 22%, rgba(255,240,210,.9) 50%, transparent 51%),
      radial-gradient(1px 1px at 34% 68%, rgba(255,240,210,.7) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 56% 14%, rgba(255,240,210,.8) 50%, transparent 51%),
      radial-gradient(1px 1px at 71% 42%, rgba(255,240,210,.6) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 86% 74%, rgba(255,240,210,.85) 50%, transparent 51%),
      radial-gradient(1px 1px at 22% 84%, rgba(255,240,210,.55) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 45% 50%, rgba(255,240,210,.5) 50%, transparent 51%),
      radial-gradient(1px 1px at 64% 88%, rgba(255,240,210,.7) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 8% 55%, rgba(255,240,210,.6) 50%, transparent 51%),
      radial-gradient(1px 1px at 91% 30%, rgba(255,240,210,.75) 50%, transparent 51%);
    animation:twinkle 5s ease-in-out infinite alternate;
  }
  @keyframes twinkle{from{opacity:.35}to{opacity:.9}}

  #fw{position:fixed;inset:0;z-index:5;pointer-events:none;}

  /* ---------- книга / обложка ---------- */
  .scene{position:fixed;inset:0;z-index:10;perspective:2200px;perspective-origin:50% 50%;}
  .book{
    position:absolute;inset:0;
    transform-style:preserve-3d;
    transform-origin:left center;
    transition:transform 1.5s cubic-bezier(.72,.02,.18,1);
  }
  .book.dragging{transition:none;}
  .face{
    position:absolute;inset:0;backface-visibility:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    overflow:hidden;
  }
  /* обложка */
  .front{
    background:
      radial-gradient(90% 70% at 50% 30%, rgba(232,195,122,.08), transparent 60%),
      radial-gradient(120% 90% at 50% 20%, #1c1433 0%, #120d24 45%, #0c0918 100%);
  }
  .front::before{ /* тонкая золотая рамка, как на журнале */
    content:"";position:absolute;inset:14px;border:1px solid rgba(232,195,122,.28);
    border-radius:6px;pointer-events:none;
  }
  .front::after{
    content:"";position:absolute;inset:20px;border:1px solid rgba(232,195,122,.12);
    border-radius:4px;pointer-events:none;
  }
  /* вторая страница (заглушка) */
  .back{
    transform:rotateY(180deg);
    background:
      radial-gradient(90% 70% at 50% 70%, rgba(232,195,122,.07), transparent 60%),
      radial-gradient(120% 90% at 50% 80%, #181126 0%, #100c1f 50%, #0c0918 100%);
  }
  .back::before{
    content:"";position:absolute;inset:14px;border:1px solid rgba(232,195,122,.22);
    border-radius:6px;pointer-events:none;
  }

  /* ---------- заголовок ---------- */
  .title{
    font-style:italic;font-weight:600;
    font-size:clamp(2.1rem, 8.5vw, 5.2rem);
    letter-spacing:.04em;text-align:center;line-height:1.15;
    text-shadow:0 0 30px rgba(232,195,122,.25);
    padding:0 24px;
  }
  .title span{
    display:inline-block;opacity:0;transform:translateY(26px) rotate(1.5deg);
    filter:blur(4px);
    animation:rise 1.1s cubic-bezier(.22,.9,.3,1) forwards;
  }
  @keyframes rise{
    to{opacity:1;transform:translateY(0) rotate(0);filter:blur(0);}
  }
  .divider{
    width:0;height:1px;margin:26px 0 20px;
    background:linear-gradient(90deg, transparent, var(--gold-soft), transparent);
    animation:grow 1.4s ease .4s forwards;
  }
  @keyframes grow{to{width:min(220px,50vw);}}
  .signature{
    font-family:'Caveat', cursive;font-weight:500;
    font-size:clamp(1.25rem, 4.5vw, 1.9rem);
    color:rgba(232,195,122,.85);
    opacity:0;transform:translateY(14px);
    animation:rise 1.2s cubic-bezier(.22,.9,.3,1) 1.15s forwards;
  }

  /* ---------- загнутый уголок ---------- */
  .corner{
    position:absolute;right:0;bottom:0;width:96px;height:96px;z-index:20;
    cursor:grab;touch-action:none;
    animation:cornerHint 2.6s ease-in-out 4s infinite;
  }
  @keyframes cornerHint{
    0%,100%{transform:translate(0,0);}
    50%{transform:translate(-6px,-6px);}
  }
  .corner::before{ /* сам загиб */
    content:"";position:absolute;right:0;bottom:0;
    width:100%;height:100%;
    background:linear-gradient(315deg, transparent 49.5%, rgba(12,9,24,1) 50%),
               linear-gradient(315deg, transparent 49.5%, #2a2145 50%);
    background-size:100% 100%;
    border-radius:0 0 6px 0;
    filter:drop-shadow(-4px -4px 8px rgba(0,0,0,.55));
    transition:width .35s ease, height .35s ease;
  }
  .corner::after{ /* блик на сгибе */
    content:"";position:absolute;right:0;bottom:0;
    width:100%;height:100%;
    background:linear-gradient(315deg, transparent 48%, rgba(232,195,122,.35) 49.5%, transparent 52%);
    border-radius:0 0 6px 0;
  }
  .corner:hover::before{width:112px;height:112px;}
  .corner-hint{
    position:absolute;right:110px;bottom:26px;white-space:nowrap;
    font-family:'Caveat', cursive;font-size:1.15rem;color:rgba(232,195,122,.7);
    opacity:0;animation:hintFade 2.6s ease-in-out 4s infinite;pointer-events:none;
  }
  @keyframes hintFade{0%,100%{opacity:0}30%,60%{opacity:.9}}

  .back .corner{left:0;right:auto;transform:scaleX(-1);}
  .back .corner-hint{right:auto;left:110px;transform:scaleX(-1);}

  .soon{
    font-style:italic;font-weight:500;text-align:center;
    font-size:clamp(1.4rem, 5vw, 2.4rem);color:rgba(232,195,122,.9);
    opacity:0;animation:rise 1.2s ease 1.2s forwards;
    padding:0 24px;
  }
  .soon-sub{
    margin-top:14px;font-family:'Caveat',cursive;font-size:clamp(1.1rem,3.8vw,1.5rem);
    color:rgba(232,195,122,.6);opacity:0;animation:rise 1.2s ease 1.9s forwards;
  }
</style>
</head>
<body>

<canvas id="fw"></canvas>

<div class="scene">
  <div class="book" id="book">

    <!-- ОБЛОЖКА -->
    <section class="face front">
      <h1 class="title" id="title"></h1>
      <div class="divider"></div>
      <div class="signature">by roretyu</div>
      <div class="corner-hint">потяни за уголок</div>
      <div class="corner" id="cornerFront"></div>
    </section>

    <!-- ВТОРАЯ СТРАНИЦА (заглушка) -->
    <section class="face back">
      <div class="soon">Здесь будет продолжение…</div>
      <div class="soon-sub">а пока — загляни обратно</div>
      <div class="corner-hint">перевернуть обратно</div>
      <div class="corner" id="cornerBack"></div>
    </section>

  </div>
</div>

<script>
/* ============ ТЕКСТ: появление по буквам ============ */
(function(){
  const el = document.getElementById('title');
  const text = 'С днём рождения!';
  let i = 0;
  for (const ch of text) {
    const s = document.createElement('span');
    s.textContent = ch === ' ' ? '\u00A0' : ch;
    s.style.animationDelay = (2.0 + i * 0.07) + 's';
    el.appendChild(s);
    i++;
  }
})();

/* ============ ФЕЙЕРВЕРК (лёгкий, ~3 сек) ============ */
(function(){
  const cv = document.getElementById('fw');
  const ctx = cv.getContext('2d');
  const DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  let W, H;
  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize(); window.addEventListener('resize', resize);

  const COLORS = ['#ffd98a','#ff9ecb','#fff3d6','#c9a4ff','#ffe9b0'];
  let parts = [], running = true;

  function burst(x, y){
    const n = window.innerWidth < 600 ? 60 : 85;
    const col = COLORS[Math.floor(Math.random()*COLORS.length)];
    for (let i = 0; i < n; i++){
      const a = Math.random() * Math.PI * 2;
      const sp = 1.5 + Math.random() * 3.6;
      parts.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 1,
        decay: 0.010 + Math.random() * 0.014,
        r: 1 + Math.random() * 1.8,
        c: Math.random() < .7 ? col : COLORS[Math.floor(Math.random()*COLORS.length)]
      });
    }
  }

  // ракеты по очереди, всего ~3 секунды
  const shots = [
    {x:.25, y:.30, d:350}, {x:.72, y:.24, d:950},
    {x:.50, y:.36, d:1500}, {x:.82, y:.40, d:2050}, {x:.18, y:.46, d:2500}
  ];
  shots.forEach(s => setTimeout(() => burst(W*s.x, H*s.y), s.d));

  function tick(){
    if (!running && parts.length === 0){ ctx.clearRect(0,0,W,H); return; }
    ctx.clearRect(0, 0, W, H);
    for (let i = parts.length - 1; i >= 0; i--){
      const p = parts[i];
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.985; p.vy = p.vy * 0.985 + 0.045;
      p.life -= p.decay;
      if (p.life <= 0){ parts.splice(i, 1); continue; }
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.fillStyle = p.c;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, 6.283);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(tick);
  }
  tick();
  setTimeout(() => { running = false; }, 3300); // после 3.3с останавливаем
})();

/* ============ ПЕРЕВОРОТ СТРАНИЦЫ ЗА УГОЛОК ============ */
(function(){
  const book = document.getElementById('book');
  let flipped = false, dragging = false, startX = 0, progress = 0;
  const THRESH = 0.35;

  function setProgress(p){
    book.style.transform = 'rotateY(' + (-p * 180) + 'deg)';
  }
  function settle(flip){
    flipped = flip;
    book.classList.remove('dragging');
    book.style.transform = '';
    book.classList.toggle('flipped', flip);
  }

  function onDown(e){
    dragging = true; startX = e.clientX; progress = flipped ? 1 : 0;
    book.classList.add('dragging');
    e.preventDefault();
  }
  function onMove(e){
    if (!dragging) return;
    const dx = startX - e.clientX;
    let p = flipped ? 1 - (-dx / (window.innerWidth * 0.75))
                    : dx / (window.innerWidth * 0.75);
    progress = Math.max(0, Math.min(1, p));
    setProgress(progress);
  }
  function onUp(){
    if (!dragging) return;
    dragging = false;
    settle(progress > (flipped ? 1 - THRESH : THRESH));
  }

  ['cornerFront','cornerBack'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('pointerdown', onDown);
  });
  window.addEventListener('pointermove', onMove, {passive:false});
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);

  // CSS-класс для финального переворота
  const st = document.createElement('style');
  st.textContent = '.book.flipped{transform:rotateY(-180deg);}';
  document.head.appendChild(st);
})();
</script>
</body>
</html>
